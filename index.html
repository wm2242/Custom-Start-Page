<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>自定义起始页</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="settings" class="settings-btn" title="设置">
<svg viewBox="0 0 24 24">
<path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.4 7.4 0 0 0-1.69-.98L14.5 2.42a.5.5 0 0 0-.5-.42h-4a.5.5 0 0 0-.5.42L9.12 5.1a7.4 7.4 0 0 0-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.02.66.07.98l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.68c.05.24.25.42.5.42h4c.25 0 .45-.18.5-.42l.38-2.68c.61-.25 1.17-.58 1.69-.98l2.49 1a.5.5 0 0 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/>
</svg>
</button>


<div id="panel">

<h3>搜索设置</h3>
<select id="engine"></select>


<h3 class="collapse-title" data-target="engine-list">
搜索引擎管理 <span>⌄</span>
</h3>

<div id="engine-list" class="collapse-box"></div>


<h3>添加搜索引擎</h3>

<button id="show-engine-form">
＋ 添加搜索引擎
</button>


<div id="engine-form" class="add-form">

<input id="engine-name"
placeholder="搜索引擎名称">

<input id="engine-url"
placeholder="搜索地址">


<input id="engine-keyword"
placeholder="快捷关键词">


<div class="form-buttons">

<button id="save-engine">
保存
</button>

<button id="cancel-engine">
取消
</button>

</div>

</div>


<h3 class="collapse-title" data-target="editor">
导航卡片管理 <span>⌄</span>
</h3>

<div id="editor" class="collapse-box"></div>


<button id="show-site-form">
＋ 添加网站
</button>


<div id="site-form" class="add-form">

<input id="site-name"
placeholder="网站名称">


<input id="site-url"
placeholder="网站地址">


<div class="form-buttons">

<button id="save-site">
保存
</button>


<button id="cancel-site">
取消
</button>

</div>

</div>


<h3>主题设置</h3>

<select id="theme-mode">
<option value="system">system</option>
<option value="light">light</option>
<option value="dark">dark</option>
</select>


<h3>卡片显示</h3>

<div class="card-setting">
<label>
每行卡片数量
</label>

<input id="card-columns"
type="number"
min="2"
max="10">
</div>


<div class="card-setting hide-setting">

<label for="hide-cards">
<span>隐藏所有卡片</span>

<div class="switch">
<input id="hide-cards" type="checkbox">
<span class="slider"></span>
</div>

</label>

</div>


<h3>数据管理</h3>

<button id="export-data">
导出数据
</button>


<label class="import-label">

导入数据

<input id="import-data"
type="file"
accept=".json">

</label>


</div>


<main class="container">

<div class="logo">
自定义起始页
</div>


<form id="search"
class="search-wrapper">


<input id="query"
class="search-box"
placeholder="搜索网页"
autofocus>


<button id="search-btn" type="submit">
<svg class="search-icon" viewBox="0 0 24 24">
<path d="M10.5 5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/>
<path d="m15 15 5 5"/>
</svg>
</button>
<button id="search-engine-btn"
type="button">
⌄
</button>


<div id="search-engine-menu"></div>


</form>


<div id="sites"
class="shortcuts"></div>


</main>


<div id="card-editor">


<input id="card-name"
placeholder="名称">


<input id="card-url"
placeholder="网址">


<select id="card-icon-type">

<option value="auto">
自动图标
</option>

<option value="url">
图片地址
</option>

<option value="emoji">
Emoji
</option>

</select>


<input id="card-icon"
placeholder="图标内容">


<button id="save-card">
保存
</button>


<button id="cancel-card">
取消
</button>


</div>


<script src="app.js"></script>

</body>
</html>
